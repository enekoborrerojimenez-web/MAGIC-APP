function showMessage(t){
 const m=document.getElementById("msg");m.textContent=t;m.style.display="block";
 setTimeout(()=>m.style.display="none",1100);
}
function magic(){
 if(!armed)return;
 armed=false;
 const f=document.getElementById("flash"); f.style.opacity=1;
 setTimeout(()=>{drawOverlay();f.style.opacity=0;},110);
}
document.getElementById("secret").addEventListener("click",()=>{
 taps++;clearTimeout(timer);timer=setTimeout(()=>taps=0,850);
 if(taps>=4){
   taps=0;document.getElementById("panel").style.display="block";showMessage("Elige la app secreta 🎩");
 }
 else if(armed) magic();
});
document.getElementById("pagehint").addEventListener("click",()=>{
 // Three quick taps on the bottom-left changes page for the magician.
});
document.getElementById("close").onclick=()=>document.getElementById("panel").style.display="none";
for(const name of Object.keys(D.sources)){
 const b=document.createElement("button");b.textContent=name;
 b.onclick=()=>{target=name;armed=true;document.getElementById("panel").style.display="none";showMessage("Preparado ✨");};
 document.getElementById("buttons").appendChild(b);
}
let pt=0,ptimer;
document.getElementById("screen").addEventListener("click",(e)=>{
 if(e.target.closest("#panel")||e.target.id==="secret")return;
 // Two-finger/page-switch isn't reliable in a web app; use a three-tap gesture in the upper-left corner to switch pages.
 const r=document.getElementById("screen").getBoundingClientRect();
 if(e.clientX-r.left<90 && e.clientY-r.top<90){
   pt++;clearTimeout(ptimer);ptimer=setTimeout(()=>pt=0,700);
   if(pt>=3){pt=0;page=1-page;armed=false;canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);base.src=page===0?imgs.p1.src:imgs.p2.src;showMessage(page===0?"Página 1":"Página 2");}
 }
});
Promise.all([new Promise(r=>imgs.p1.onload=r),new Promise(r=>imgs.p2.onload=r)]).then(fit);
</script></body></html>
